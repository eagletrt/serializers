name: Docker image

# Builds the generator image on every change to what goes into it, runs `check`
# with it on both platforms, and only then publishes it on
# ghcr.io/eagletrt/serializers:<version> when a `vX.Y.Z` tag is pushed
# (e.g. `git tag v1.0.0 && git push origin v1.0.0` publishes `1.0.0`, `1.0`
# and `latest`). A tag on a commit whose tests fail publishes nothing.

on:
  workflow_dispatch:
  push:
    tags: ['v*.*.*']
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - src/**
      - scripts/**
      - requirements.txt
      - .github/workflows/docker.yaml

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io (only on tags)
    steps:
      - uses: actions/checkout@v4

      # The protos the image is tested with.
      - name: Clone telemetry-serializers
        uses: actions/checkout@v4
        with:
          repository: eagletrt/telemetry-serializers
          path: telemetry-serializers

      # Emulation to run the linux/arm64 variant on the amd64 runner.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest` is added on semver tags by default (flavor latest=auto).
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Each platform is built and loaded on its own, so that the image that
      # gets published is the one that passed the tests (same layers, from
      # the cache).
      - name: Build for the tests (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: serializers:test-amd64
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,scope=amd64,mode=max

      - name: Generate, compile and test (linux/amd64)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD/telemetry-serializers/proto:/in:ro" \
            serializers:test-amd64 check

      - name: Build for the tests (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: serializers:test-arm64
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,scope=arm64,mode=max

      - name: Generate, compile and test (linux/arm64, emulated)
        run: |
          docker run --rm --platform linux/arm64 --user "$(id -u):$(id -g)" \
            -v "$PWD/telemetry-serializers/proto:/in:ro" \
            serializers:test-arm64 check

      - name: Log in to ghcr.io
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          # amd64 (Linux, Windows, Intel Mac) and arm64 (Apple Silicon, ARM Linux)
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=arm64
