name: Docker image

# Builds the generator image on every change to what goes into it, and
# publishes it on ghcr.io/eagletrt/serializers:<version> when a `vX.Y.Z` tag is
# pushed (e.g. `git tag v1.0.0 && git push origin v1.0.0` publishes `1.0.0`).

on:
  workflow_dispatch:
  push:
    tags: ['v*.*.*']
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - src/**
      - scripts/**
      - requirements.txt
      - .github/workflows/docker.yaml

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Emulation to build the linux/arm64 variant on the amd64 runner.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}

      - name: Build (and push on tags)
        uses: docker/build-push-action@v6
        with:
          context: .
          # amd64 (Linux, Windows, Intel Mac) and arm64 (Apple Silicon, ARM Linux)
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
