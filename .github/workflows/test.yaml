name: Run Tests

# The tests run inside the generator image, the same one that consumers use, so
# the generator is always tested with the toolchain it ships with.

on:
    push:
        branches:
            - "**"
    pull_request:
        branches:
            - "**"

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Main Repository
              uses: actions/checkout@v4

            - name: Clone telemetry-serializers
              uses: actions/checkout@v4
              with:
                  repository: "eagletrt/telemetry-serializers"
                  path: telemetry-serializers

            - name: Build the generator image
              run: docker build -t serializers:test .

            - name: Generate, compile and test
              run: |
                  docker run --rm \
                      -v "$PWD/telemetry-serializers/proto:/in:ro" \
                      serializers:test check
